name: TBX + Starling 0.8.0 - preparar codigo (SEM APK)
run-name: TBX Starling 0.8.0 · interface azul · apenas codigo
on:
  push:
    branches: [experiment/starling-v080-tbx-blue-ui]
    paths:
      - .github/workflows/tbx-starling-source-only.yml
      - tools/apply_starling_tbx_ui.py
      - tools/apply_tbx_localization_mod_help.py
      - tools/tbx_mod_rust_assistant.py
      - tools/test_tbx_mod_rust_assistant.py
      - tools/apply_tbx_android_crash_i18n.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Buscar somente ferramentas privadas TBX
        uses: actions/checkout@v4

      - name: Verificar sintaxe do patch sem instalar dependencias
        run: |
          python3 -m py_compile tools/apply_starling_tbx_ui.py tools/apply_tbx_localization_mod_help.py tools/apply_tbx_android_crash_i18n.py tools/tbx_mod_rust_assistant.py
          python3 -m unittest discover -s tools -p 'test_tbx_mod_rust_assistant.py' -v

      - name: Obter fonte oficial Starling 0.8.0 (commit fixo)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/starling-src"
          curl -fLSs --retry 3 --max-time 240 \
            https://codeload.github.com/starling-client/starling/tar.gz/ac874422ed8f892505ff73d67ae486ecfee7a516 \
            -o "$RUNNER_TEMP/starling-v0.8.0.tar.gz"
          tar -xzf "$RUNNER_TEMP/starling-v0.8.0.tar.gz" \
            -C "$RUNNER_TEMP/starling-src" --strip-components=1
          test -f "$RUNNER_TEMP/starling-src/Cargo.toml"
          test -f "$RUNNER_TEMP/starling-src/LICENSE"
          test -f "$RUNNER_TEMP/starling-src/THIRD_PARTY_NOTICES.md"
          echo "Fonte oficial e avisos de licença mantidos"

      - name: Auditar e aplicar mudancas TBX sem gerar APK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_starling_tbx_ui.py "$RUNNER_TEMP/starling-src" --check
          python3 tools/apply_starling_tbx_ui.py "$RUNNER_TEMP/starling-src"
          python3 tools/apply_tbx_localization_mod_help.py "$RUNNER_TEMP/starling-src" --check
          python3 tools/apply_tbx_android_crash_i18n.py "$RUNNER_TEMP/starling-src" --check
          python3 tools/apply_tbx_android_crash_i18n.py "$RUNNER_TEMP/starling-src"
          python3 tools/apply_tbx_android_crash_i18n.py "$RUNNER_TEMP/starling-src" --check
          python3 tools/apply_tbx_localization_mod_help.py "$RUNNER_TEMP/starling-src"
          python3 tools/apply_tbx_localization_mod_help.py "$RUNNER_TEMP/starling-src" --check
          python3 tools/apply_starling_tbx_ui.py "$RUNNER_TEMP/starling-src" --check
          STARLING_SRC="$RUNNER_TEMP/starling-src" python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["STARLING_SRC"])
          controls=(root/"crates/horizon-client-render/src/android_controls.rs").read_text()
          assert "if c == Control::Settings {\n            return false;" in controls
          assert "Some(Control::Settings) =>" in controls  # leave menu routing intact
          palette=(root/"crates/horizon-theme/src/lib.rs").read_text()
          assert "    accent: 0x60a5fa," in palette
          theme=(root/"crates/horizon-client/src/android_control_theme.rs").read_text()
          assert "preset: ThemePreset::TbxBlue," in theme
          import json
          pt=json.loads((root/"crates/horizon-client/assets/horizon/lang/pt_br.json").read_text())
          en=json.loads((root/"crates/horizon-client/assets/horizon/lang/en_us.json").read_text())
          assert all(key in pt and key in en for key in (
              "tbx.mods.guide.native", "tbx.mods.guide.jar",
              "tbx.diagnostics.summary.previous", "tbx.diagnostics.notice.raw"))
          diag=(root/"crates/horizon-client/src/diagnostics.rs").read_text()
          assert 'crate::lang::get("tbx.diagnostics.summary.export")' in diag
          mods=(root/"crates/horizon-client-render/src/options_ui.rs").read_text()
          assert 'lang::get("tbx.mods.guide.jar")' in mods
          java=(root/"packaging/android/java/io/github/juanluci/starling/DiagnosticsActivity.java").read_text()
          lang_reader=(root/"packaging/android/java/io/github/juanluci/starling/TbxLanguage.java").read_text()
          android_pt=(root/"packaging/android/res/values-pt-rBR/diagnostics.xml").read_text()
          assert 'status.setText(tx(intro))' in java and 'button.setText(tx(text))' in java
          assert 'line.startsWith("lang:")' in lang_reader
          assert 'Falha no diagnóstico' in android_pt
          print("TBX diagnostics Android source verification passed; no APK compiled.")
          PY

      - name: Guardar codigo fonte adaptado (nao e APK)
        shell: bash
        run: |
          set -euo pipefail
          cp tools/tbx_mod_rust_assistant.py "$RUNNER_TEMP/starling-src/tools/tbx_mod_rust_assistant.py"
          cat > "$RUNNER_TEMP/starling-src/TBX-LEIA-ME-PORTUGUES.md" <<'DOC'
          # TBX + Starling 0.8.0: somente codigo-fonte
          O jogo nao foi compilado e nao existe APK dessa etapa.
          A V1.0.4 aprovada da TBX Edition nao foi substituida.
          
          Leia o diagnostico de um mod Java sem executa-lo:
          python3 tools/tbx_mod_rust_assistant.py inspect caminho/mod.jar --lang pt_br
          
          Prepare um projeto Rust inicial e extraia recursos para analise:
          python3 tools/tbx_mod_rust_assistant.py prepare caminho/mod.jar --output adaptacao_mod --lang pt_br
          
          ATENCAO: o assistente nao converte classes Java para Rust automaticamente.
          O projeto gerado nao e um .hnmod e nao e jogavel sem reimplementar a logica.
          O botao Compilar no Starling so inclui mods nativos .hnmod ja compativeis.
          Os registros tecnicos de diagnostico nao sao traduzidos nem alterados.
          DOC
          mkdir -p dist
          tar -czf dist/TBX-Starling-0.8.0-Codigo-Fonte-Azul.tar.gz \
            -C "$RUNNER_TEMP/starling-src" .
          sha256sum dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Disponibilizar somente codigo adaptado
        uses: actions/upload-artifact@v4
        with:
          name: TBX-Starling-v080-Codigo-Fonte-Azul
          path: dist/
          if-no-files-found: error
          retention-days: 7
